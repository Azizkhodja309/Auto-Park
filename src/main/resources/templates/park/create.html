<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create park</title>
</head>
<body>
    <form th:action="@{/park/create}" th:method="POST">
        <div class="mb-3">
            <label for="name" class="form-label">Enter auto park name</label>
            <input type="text" class="form-control" id="name" th:name="name" required>
        </div>
        <button type="submit">Save</button>
    </form>
</body>
</html>
